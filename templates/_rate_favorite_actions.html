{# Rate select + Favorite toggle. Expects: media_type, trakt_id, rating, favorited; optional btn_class #}
{% set _btn = btn_class|default('btn btn-small') %}
<select class="rate-select"
        aria-label="Rate on Trakt"
        data-media-type="{{ media_type }}"
        data-trakt-id="{{ trakt_id }}"
        title="Trakt rating (1–10)">
  <option value=""{% if not rating %} selected{% endif %}>Rate…</option>
  {% for n in range(1, 11) %}
    <option value="{{ n }}"{% if rating == n %} selected{% endif %}>{{ n }}/10</option>
  {% endfor %}
  {% if rating %}<option value="clear">Clear rating</option>{% endif %}
</select>
{% if favorited %}
  <button class="{{ _btn }}" type="button"
          data-action="favorite-remove"
          data-media-type="{{ media_type }}"
          data-trakt-id="{{ trakt_id }}"
          title="Remove from Trakt favorites">Unfavorite</button>
{% else %}
  <button class="{{ _btn }}" type="button"
          data-action="favorite-add"
          data-media-type="{{ media_type }}"
          data-trakt-id="{{ trakt_id }}"
          title="Add to Trakt favorites">Favorite</button>
{% endif %}
