{# Page title + compact Help. Expects: heading, help_topic (docs/help/user slug). #}
<div class="page-heading">
  <h1>{{ heading }}</h1>
  <a class="page-help" href="{{ url_for('user.help_page', topic=help_topic) }}"
     title="Help for this page" aria-label="Help for {{ heading }}">?</a>
</div>
